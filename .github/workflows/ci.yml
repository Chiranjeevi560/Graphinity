name: CI

on:
  push:
  pull_request:

# Read-only token: nothing in CI can push, tag or publish.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      # Supabase runs Postgres 17; test against the same major version.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # Actions are pinned to full commit hashes; a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # .npmrc sets ignore-scripts, so no dependency runs code on install.
      - name: Install exactly what the lockfile says
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test (unit, server and real-database integration)
        run: npm test
        env:
          TEST_DATABASE_ADMIN_URL: postgres://postgres:ci-only-password@localhost:5432/postgres

      - name: Build
        run: npm run build
        env:
          VITE_API_ORIGIN: https://api.invalid
