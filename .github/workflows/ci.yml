name: CI

# Pull requests, and main once merged: each change runs once, not again
# for the branch push behind its pull request.
on:
  push:
    branches: [main]
  pull_request:

# Read-only token: nothing in CI can push, tag or publish.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every check here mirrors a row in CONSTRAINTS.md. If they disagree, that file wins.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      # Supabase runs Postgres 17 with pgvector; test against the same. The
      # pgvector project's own image, pinned by digest (0.8.1-pg17).
      postgres:
        image: pgvector/pgvector@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ADMIN_URL: postgres://postgres:ci-only-password@localhost:5432/postgres
      # What this change is compared with: the pull request's base, or the previous main.
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

    steps:
      # Actions are pinned to full commit hashes; a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the secret scan reads every commit, the floor guard diffs against the last push.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # .npmrc sets ignore-scripts, so no dependency runs code on install.
      - name: Install exactly what the lockfile says
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (no new findings)
        run: npm run lint

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Floor guard (nothing silenced, skipped or left unfinished)
        run: |
          BASE="$BASE_SHA"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE=HEAD~1; fi
          node scripts/floor-guard.mjs --base "$BASE"

      - name: Test with coverage (unit, server, real-database integration)
        run: npm run test:coverage
        env:
          TEST_DATABASE_ADMIN_URL: ${{ env.ADMIN_URL }}

      # pg_dump from the same pinned image as the database, so the versions match.
      - name: Migrations (lint, nothing shipped edited, an upgrade ends where a fresh install does)
        env:
          CHECK_DATABASE_ADMIN_URL: ${{ env.ADMIN_URL }}
          PG_DUMP: docker run --rm --network host pgvector/pgvector@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21 pg_dump
        run: |
          BASE="$BASE_SHA"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE=HEAD~1; fi
          node scripts/check-migrations.mjs --base "$BASE"

      - name: Build
        run: npm run build

      - name: Bundle size budget
        run: npm run check:size

      # Scanners: official release binaries, checked against their published checksums.
      - name: Install gitleaks and osv-scanner
        run: sh scripts/install-tools.sh

      - name: Secrets (whole history, values redacted)
        run: .local/tools/gitleaks git --redact --no-banner .

      - name: Vulnerable dependencies
        run: npm run check:deps

      - name: Dependency licences (allow-list in CONSTRAINTS.md)
        run: npm run check:licenses

      # Semgrep's official image, pinned by digest (1.178.0, published 2026-09-23):
      # every dependency inside it is fixed, unlike a pip install.
      - name: Code security (Semgrep)
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b \
            semgrep scan --config p/default --config p/owasp-top-ten --config p/typescript --config p/react \
            --severity ERROR --error --metrics off --quiet apps scripts db

      - name: Prepare the database for browser tests
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE graphinity"
          # An administrator turns pgvector on, as Supabase's dashboard does.
          psql "${ADMIN_URL%/postgres}/graphinity" -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS extensions" -c "CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA extensions"
          MIGRATION_DATABASE_URL="${ADMIN_URL%/postgres}/graphinity" node apps/api/src/migrate-main.ts
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE graphinity_api LOGIN PASSWORD 'ci-only-api' IN ROLE app_api" -c "GRANT CONNECT ON DATABASE graphinity TO graphinity_api"
          printf 'DATABASE_URL=postgres://graphinity_api:ci-only-api@localhost:5432/graphinity\nIP_HASH_KEY=%s\nSUPABASE_URL=http://localhost:54321\nSUPABASE_SECRET_KEY=unused_in_ci_0123456789\n' "$(openssl rand -hex 32)" > .local/api.env

      # The image a release would ship, built from this commit: scanned, then started the way
      # staging starts it (production mode, the API's restricted login, this run's database) and
      # required to answer /health with this exact commit.
      - name: API image (build, scan, start in production mode)
        run: |
          docker build --build-arg RELEASE="$GITHUB_SHA" -t graphinity-api:ci .
          .local/tools/osv-scanner scan image --format json --output-file image-vulns.json graphinity-api:ci || true
          node scripts/image-report.mjs image-vulns.json
          # It must declare the unprivileged user, and run with no writable disk, no Linux
          # capabilities and no way to gain privileges: if it needed any of those, it would fail here.
          test "$(docker inspect --format '{{.Config.User}}' graphinity-api:ci)" = node
          set -a; . .local/api.env; set +a
          docker run -d --name api-smoke --network host --read-only --cap-drop=ALL \
            --security-opt no-new-privileges -e PORT=3100 -e APP_ENV=staging \
            -e WEB_ORIGIN=https://smoke.example -e SUPABASE_URL=https://smoke.supabase.co -e TRUST_PROXY_HOPS=0 \
            -e DATABASE_URL -e IP_HASH_KEY -e SUPABASE_SECRET_KEY graphinity-api:ci
          for i in $(seq 30); do curl -sf http://127.0.0.1:3100/health > health.json && break; sleep 1; done
          # Its own log says why if it never answered (the server never logs secrets).
          [ -s health.json ] || docker logs api-smoke
          docker rm -f api-smoke > /dev/null
          node -e '
            const h = JSON.parse(require("fs").readFileSync("health.json", "utf8"));
            const want = { status: "ok", environment: "staging", release: process.env.GITHUB_SHA };
            for (const [k, v] of Object.entries(want)) if (h[k] !== v) { console.error(`/health ${k}: ${h[k]}, expected ${v}`); process.exit(1); }
            console.log(`image answered /health: ${JSON.stringify(h)}`);'

      - name: Install browsers (Chromium, WebKit, Firefox)
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Browser audit (every screen, three engines)
        run: npx playwright test --project=chromium --project=webkit --project=firefox

      - name: Page speed (Lighthouse)
        run: npm run check:perf

      - name: Keep the browser audit report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-audit
          path: test-results/
          retention-days: 14
